# EmpiFlow kit — the whole stack, one file (D-001, D-002, D-005, D-006, D-008).
#
#   db · redis-cache · redis-queue · configurator · create-site
#   backend · websocket · frontend · queue-long · scheduler · metabase
#
# Start it with `install.ps1` / `start.ps1` (they pick the Docker engine for you); by hand:
#   docker compose --env-file .env -f compose.yml up -d
#
# The image is built by CI from this repo. Nothing here is built on the client machine (D-011).
name: empiflow

x-image: &image ${EMPI_IMAGE:-ghcr.io/empiflow/empiflow-kit-erpnext}:${EMPI_IMAGE_TAG:-v1.0.0}

x-frappe: &frappe
  image: *image
  restart: unless-stopped
  networks: [empiflow_net]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  environment: &frappe-env
    DB_HOST: db
    DB_PORT: "3306"
    REDIS_CACHE: redis-cache:6379
    REDIS_QUEUE: redis-queue:6379

services:
  db:
    image: mariadb:${MARIADB_VERSION:-11.8}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing — copy .env.example to .env and set it}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [empiflow_net]

  redis-cache:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [empiflow_net]

  redis-queue:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [empiflow_net]

  # One-shot: writes the shared connection settings into the sites volume. Runs before everything else.
  configurator:
    <<: *frappe
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port 9000;
        echo configurator: done
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  # One-shot: new site + erpnext + hrms + production flags + metabase_ro. Idempotent (see docker/create-site.sh).
  create-site:
    <<: *frappe
    restart: "no"
    command: ["create-site.sh"]
    environment:
      <<: *frappe-env
      SITE_NAME: ${SITE_NAME:?SITE_NAME is missing}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is missing}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing}
      MB_RO_PASSWORD: ${MB_RO_PASSWORD:-metabase_ro}
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *frappe
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    <<: *frappe
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    <<: *frappe
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?SITE_NAME is missing}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

  # One worker drains all three queues — the second worker CAF_stack runs is redundant (D-001).
  queue-long:
    <<: *frappe
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *frappe
    command: ["bench", "schedule"]
    depends_on:
      create-site:
        condition: service_completed_successfully

  # Own metadata in an H2 file on a volume; reads ERPNext through metabase_ro (D-006).
  metabase:
    image: metabase/metabase:${METABASE_VERSION:-v0.65.4}
    restart: unless-stopped
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: "3000"
      JAVA_OPTS: "-Xmx700m"
      MB_ANON_TRACKING_ENABLED: "false"
    volumes:
      - metabase-data:/metabase-data
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    depends_on:
      create-site:
        condition: service_completed_successfully
    networks: [empiflow_net]

volumes:
  db-data:
  sites:
  logs:
  metabase-data:

networks:
  empiflow_net:
    driver: bridge
