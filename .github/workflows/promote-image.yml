name: promote image

# Copies an already-built, already-tested tag (:dev) to a release tag (:vX.Y.Z).
# This is a deliberate, human step: the acceptance suite must have passed against :dev first (D-011).
# It does not rebuild anything — the release tag points at exactly the digest that was tested.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish, e.g. v1.0.0'
        required: true
      source:
        description: 'Existing tag to copy'
        required: true
        default: dev
      note:
        description: 'What was tested, and where (goes into the run summary)'
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/empiflow/empiflow-kit-erpnext

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy ${{ inputs.source }} to ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:${{ inputs.version }}" \
            "$IMAGE:${{ inputs.source }}"
          docker buildx imagetools inspect "$IMAGE:${{ inputs.version }}"

      - name: Run summary
        run: |
          {
            echo "### Promoted \`${{ inputs.source }}\` → \`${{ inputs.version }}\`"
            echo ""
            echo "- image: \`$IMAGE:${{ inputs.version }}\`"
            echo "- by: @${{ github.actor }}"
            echo "- note: ${{ inputs.note }}"
          } >> "$GITHUB_STEP_SUMMARY"
